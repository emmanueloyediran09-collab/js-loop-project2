<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizzBuzz 150</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <header class="hero">
            <div>
                <p class="eyebrow">JavaScript Loop Challenge</p>
                <h1>FizzBuzz <span>150</span></h1>
            </div>
            <div class="legend" aria-label="Result legend">
                <span><i class="dot fizz"></i>Fizz</span>
                <span><i class="dot buzz"></i>Buzz</span>
                <span><i class="dot neither"></i>Neither</span>
            </div>
        </header>

        <section class="result-panel" aria-label="FizzBuzz results">
            <div id="display" class="results-grid"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
